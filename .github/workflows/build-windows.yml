name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build bot
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name RPBot --collect-all discord --collect-all openai --collect-all dotenv --hidden-import aiohttp --hidden-import tzdata src/bot.py

      - name: Build setup wizard
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name RPBot_Setup src/setup_wizard.py

      - name: Create release folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist/RPBot.exe release/RPBot.exe
          Copy-Item dist/RPBot_Setup.exe release/RPBot_Setup.exe
          Copy-Item README.md release/README_KO.md
          Copy-Item config release/config -Recurse
          Copy-Item prompts release/prompts -Recurse
          Compress-Archive -Path release/* -DestinationPath Generic-Character-RP-Bot-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Generic-Character-RP-Bot-Windows
          path: Generic-Character-RP-Bot-Windows.zip

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Generic-Character-RP-Bot-Windows.zip
          generate_release_notes: true