name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python -c "import os,sys; sys.path.insert(0,'src'); from app_version import VERSION; assert os.environ['GITHUB_REF_NAME'] == 'v' + VERSION, 'Update app_version.py before tagging a release'"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-gui.txt pyinstaller

      - name: Build bot
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name RPBot --collect-all discord --collect-all openai --collect-all dotenv --hidden-import aiohttp --hidden-import tzdata src/bot.py

      - name: Build setup wizard
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name RPBot_Setup src/setup_gui.py

      - name: Build updater
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name RPBot_Updater src/update_helper.py

      - name: Validate configuration and update behavior
        run: |
          python -m unittest discover -s tests -v

      - name: Create release folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist/RPBot.exe release/RPBot.exe
          Copy-Item dist/RPBot_Setup.exe release/RPBot_Setup.exe
          Copy-Item dist/RPBot_Updater.exe release/RPBot_Updater.exe
          Copy-Item README.md release/README_KO.md
          New-Item -ItemType Directory -Force -Path release/docs
          Copy-Item docs/*.md release/docs
          Copy-Item config release/config -Recurse
          Copy-Item prompts release/prompts -Recurse
          Compress-Archive -Path release/* -DestinationPath Generic-Character-RP-Bot-Windows.zip
          $hash = (Get-FileHash Generic-Character-RP-Bot-Windows.zip -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD/Generic-Character-RP-Bot-Windows.zip.sha256", "$hash  Generic-Character-RP-Bot-Windows.zip", [System.Text.Encoding]::ASCII)

      - uses: actions/upload-artifact@v4
        with:
          name: Generic-Character-RP-Bot-Windows
          path: |
            Generic-Character-RP-Bot-Windows.zip
            Generic-Character-RP-Bot-Windows.zip.sha256

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Generic-Character-RP-Bot-Windows.zip
            Generic-Character-RP-Bot-Windows.zip.sha256
          generate_release_notes: true