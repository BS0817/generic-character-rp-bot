name: Publish RPBot v0.1.3

on:
  push:
    branches: [main]
    paths: [".github/workflows/release-v0.1.3.yml"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8a41ba76de64aad1cc431cb279ae482abd49b5ec

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release version
        run: |
          python -c "import os,sys; sys.path.insert(0,'src'); from app_version import VERSION; assert VERSION == '0.1.3', 'Update app_version.py before tagging a release'"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-gui.txt pyinstaller

      - name: Build bot
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name RPBot --collect-all discord --collect-all openai --collect-all dotenv --hidden-import aiohttp --hidden-import tzdata src/bot.py

      - name: Build setup wizard
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name RPBot_Setup src/setup_gui.py

      - name: Build updater
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name RPBot_Updater src/update_helper.py

      - name: Validate configuration and update behavior
        run: |
          python -m unittest discover -s tests -v

      - name: Create release folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist/RPBot.exe release/RPBot.exe
          Copy-Item dist/RPBot_Setup.exe release/RPBot_Setup.exe
          Copy-Item dist/RPBot_Updater.exe release/RPBot_Updater.exe
          Copy-Item README.md release/README_KO.md
          Copy-Item config release/config -Recurse
          Copy-Item prompts release/prompts -Recurse
          Compress-Archive -Path release/* -DestinationPath Generic-Character-RP-Bot-Windows.zip
          $hash = (Get-FileHash Generic-Character-RP-Bot-Windows.zip -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD/Generic-Character-RP-Bot-Windows.zip.sha256", "$hash  Generic-Character-RP-Bot-Windows.zip", [System.Text.Encoding]::ASCII)

      - uses: actions/upload-artifact@v4
        with:
          name: Generic-Character-RP-Bot-Windows
          path: |
            Generic-Character-RP-Bot-Windows.zip
            Generic-Character-RP-Bot-Windows.zip.sha256

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Generic-Character-RP-Bot-Windows.zip
            Generic-Character-RP-Bot-Windows.zip.sha256
          tag_name: v0.1.3
          target_commitish: 8a41ba76de64aad1cc431cb279ae482abd49b5ec
          name: "RPBot v0.1.3 — GUI 설정 프로그램 · 자동 업데이트"
          body: |
            ## 새 기능
            - 한국어 GUI 설정 프로그램: 캐릭터·프롬프트·장소·세계관·관계·API·Discord 관리
            - 16개 기능 ON/OFF, 자율발언 간격과 자동 대화 턴 설정
            - 설정 저장 전 자동 백업 및 복원, 기존 설정과 추가 필드 보존
            - GitHub 정식 릴리스 확인, SHA-256 다운로드 검증 및 실행 파일 교체 실패 복구
            - 별도 RPBot_Updater.exe와 업데이트 검증 파일 제공

            ## 기존 사용자 업데이트 방법
            봇을 먼저 종료한 다음 아래 Windows ZIP을 풀어 RPBot.exe, RPBot_Setup.exe, RPBot_Updater.exe 세 실행 파일만 기존 폴더에 복사하세요.
            기존 config/, prompts/, .env와 데이터베이스를 덮어쓰지 마세요.
            RPBot_Setup.exe를 실행하면 새 GUI가 열립니다. 이후 버전은 업데이트 메뉴에서 확인·설치할 수 있습니다.

            ## 검증
            Windows 실행 파일 3개 빌드와 설정 저장·백업 복원·업데이트 실패 복구 등을 포함한 17개 검증을 통과했습니다.
            프로필 이미지는 관리 화면용이며 Discord 아바타를 변경하지 않습니다.
          make_latest: true
          draft: false
          prerelease: false